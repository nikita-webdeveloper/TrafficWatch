<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg-grad)" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.8" />
  
  <!-- Traffic Pulse Path -->
  <polyline
    points="36,136 76,136 104,72 140,184 176,108 196,136 220,136"
    fill="none"
    stroke="url(#pulse-grad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Live Signal Indicator Dot -->
  <circle cx="104" cy="72" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3" />
</svg>
